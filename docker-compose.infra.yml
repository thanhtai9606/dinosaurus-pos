services:
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER:-dinosaur-postgres}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-dinosaur}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dinosaur_dev}
      POSTGRES_DB: ${DB_NAME:-dinosaur_pos}
    ports:
      - "${DB_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dinosaur-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dinosaur} -d ${DB_NAME:-dinosaur_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: becamexidc2020/minio:latest
    container_name: ${MINIO_CONTAINER:-dinosaur-minio}
    restart: always
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - dinosaur-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: ${MEILI_CONTAINER:-dinosaur-meilisearch}
    restart: always
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_API_KEY:-dev_meili_master_key}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - dinosaur-network

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER:-dinosaur-redis}
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dinosaur-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  meili_data:

networks:
  dinosaur-network:
    driver: bridge