services:
  app:
    image: ghcr.io/agpprastyo/pos-kasir:latest
    container_name: ${APP_CONTAINER:-dinosaur-app}
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - dinosaur-network
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER:-dinosaur-postgres}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-dinosaur}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dinosaur_dev}
      POSTGRES_DB: ${DB_NAME:-dinosaur_pos}
    ports:
      - "${DB_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dinosaur-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dinosaur} -d ${DB_NAME:-dinosaur_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ${MINIO_CONTAINER:-dinosaur-minio}
    restart: always
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - dinosaur-network

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER:-dinosaur-redis}
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dinosaur-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:

networks:
  dinosaur-network:
    driver: bridge